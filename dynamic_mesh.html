<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles.js - Усиленный эффект Grab</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Убираем скролл */
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); /* Градиент для глубины */
            overflow: hidden;
        }

        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-content {
            position: relative; 
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            pointer-events: none; /* Чтобы мышь проходила сквозь текст к частицам */
        }

        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
            max-width: 600px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .debug-info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #10b981;
            padding: 10px 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div id="particles-js"></div>
        
        <div class="hero-content">
            <h1>Эффект "Grab" (Усиленный)</h1>
            <p>Наведите курсор мыши — частицы будут притягиваться к нему яркими линиями</p>
            <p style="font-size: 0.9rem; opacity: 0.7;">Двигайте мышкой по всему экрану</p>
        </div>
    </section>

    <!-- Отладочная информация -->
    <div class="debug-info" id="debug">
        Загрузка библиотеки...
    </div>

    <!-- Подключаем библиотеку particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    
    <script>
        // Проверка загрузки библиотеки
        if (typeof particlesJS === 'undefined') {
            document.getElementById('debug').innerHTML = '❌ Ошибка: particles.js не загрузился!';
            document.getElementById('debug').style.color = '#ef4444';
        } else {
            document.getElementById('debug').innerHTML = '✅ Библиотека загружена. Наведите мышь на частицы!';
            
            // Инициализация частиц с усиленными настройками
            particlesJS("particles-js", {
                "particles": {
                    "number": {
                        "value": 120, /* Увеличил количество частиц */
                        "density": {
                            "enable": true,
                            "value_area": 600 /* Уменьшил плотность = больше частиц */
                        }
                    },
                    "color": {
                        "value": "#38bdf8" /* Ярко-голубой цвет для лучшей видимости */
                    },
                    "shape": {
                        "type": "circle"
                    },
                    "opacity": {
                        "value": 1, /* Увеличил прозрачность */
                        "random": true
                    },
                    "size": {
                        "value": 1, /* Увеличил размер частиц */
                        "random": true
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 180, /* Увеличил дистанцию соединения */
                        "color": "#38bdf8",
                        "opacity": 0.6, /* Яркие линии */
                        "width": 1.5 /* Толще линии */
                    },
                    "move": {
                        "enable": true,
                        "speed": 3, /* Чуть быстрее для динамики */
                        "direction": "none",
                        "random": false,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false
                    }
                },
                "interactivity": {
                    "detect_on": "window", /* ← ВАЖНО: detect_on = "window" вместо "canvas" */
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    },
                    "modes": {
                        "grab": {
                            "distance": 300, /* ← БОЛЬШОЙ радиус захвата */
                            "line_linked": {
                                "distance": 300,
                                "opacity": 1, /* ← МАКСИМАЛЬНАЯ яркость линий */
                                "color": "#38bdf8"
                            }
                        }
                    }
                },
                "retina_detect": true
            });
        }
    </script>

</body>
</html>
