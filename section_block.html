<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокрутка блоками (Fullpage Scroll)</title>
    
    <style>
        /* Сброс отступов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ГЛАВНОЕ: Включаем snap-прокрутку для всего документа */
        html {
            scroll-snap-type: y mandatory; /* Вертикальная привязка, обязательная */
            overflow-y: scroll;
            scroll-behavior: smooth; /* Плавная прокрутка */
        }

        /* Каждый блок занимает весь экран */
        section {
            height: 100vh; /* 100% высоты экрана */
            scroll-snap-align: start; /* Привязка к началу блока */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        /* Цвета для разных блоков */
        .block-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .block-2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .block-3 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .block-4 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .block-5 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        /* Навигация сбоку (опционально) */
        .nav-dots {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 1000;
        }

        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-dot:hover {
            background: white;
            transform: scale(1.3);
        }

        /* Подсказка для первого блока */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 1rem;
            opacity: 0.7;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }
    </style>
</head>
<body>

    <!-- Навигация точками (опционально) -->
    <div class="nav-dots">
        <div class="nav-dot" onclick="scrollToSection(0)"></div>
        <div class="nav-dot" onclick="scrollToSection(1)"></div>
        <div class="nav-dot" onclick="scrollToSection(2)"></div>
        <div class="nav-dot" onclick="scrollToSection(3)"></div>
        <div class="nav-dot" onclick="scrollToSection(4)"></div>
    </div>

    <!-- Блок 1 -->
    <section class="block-1">
        <div>
            <h1>Блок 1</h1>
            <p style="font-size: 1.5rem; margin-top: 20px;">Прокрутите вниз ↓</p>
            <div class="scroll-hint">Прокрутите вниз</div>
        </div>
    </section>

    <!-- Блок 2 -->
    <section class="block-2">
        <div>
            <h1>Блок 2</h1>
            <p style="font-size: 1.5rem; margin-top: 20px;">О компании</p>
        </div>
    </section>

    <!-- Блок 3 -->
    <section class="block-3">
        <div>
            <h1>Блок 3</h1>
            <p style="font-size: 1.5rem; margin-top: 20px;">Продукция</p>
        </div>
    </section>

    <!-- Блок 4 -->
    <section class="block-4">
        <div>
            <h1>Блок 4</h1>
            <p style="font-size: 1.5rem; margin-top: 20px;">Вакансии</p>
        </div>
    </section>

    <!-- Блок 5 -->
    <section class="block-5">
        <div>
            <h1>Блок 5</h1>
            <p style="font-size: 1.5rem; margin-top: 20px;">Контакты</p>
        </div>
    </section>

    <script>
        // Функция для перехода к блоку по клику на точку
        function scrollToSection(index) {
            const sections = document.querySelectorAll('section');
            sections[index].scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
